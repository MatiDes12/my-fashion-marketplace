# Simplified Datadog Synthetic tests workflow
# This version avoids linter issues while maintaining functionality

name: Run Datadog Synthetic tests

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  datadog-synthetics:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check if Datadog is configured
      id: check-datadog
      run: |
        if [ -n "${{ secrets.DD_API_KEY }}" ] && [ -n "${{ secrets.DD_APP_KEY }}" ] && [ "${{ secrets.ENABLE_DATADOG }}" = "true" ]; then
          echo "datadog_configured=true" >> $GITHUB_OUTPUT
        else
          echo "datadog_configured=false" >> $GITHUB_OUTPUT
        fi

    - name: Run Datadog Synthetic tests
      if: steps.check-datadog.outputs.datadog_configured == 'true'
      uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb
      with:
        api_key: ${{secrets.DD_API_KEY}}
        app_key: ${{secrets.DD_APP_KEY}}
        test_search_query: 'tag:e2e-tests'

    - name: Skip Datadog tests
      if: steps.check-datadog.outputs.datadog_configured == 'false'
      run: |
        echo "Skipping Datadog Synthetic tests - Datadog not configured or disabled"
        echo "To enable Datadog tests:"
        echo "1. Add DD_API_KEY and DD_APP_KEY secrets to your repository"
        echo "2. Set ENABLE_DATADOG=true secret"
        echo "3. Or skip this step entirely - it's optional for CI/CD" 