name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for outdated dependencies
      id: check
      run: |
        npm outdated --json > outdated.json || echo "{}" > outdated.json
        echo "outdated=$(cat outdated.json)" >> $GITHUB_OUTPUT

    - name: Create branch and commit updates
      if: steps.check.outputs.outdated != '{}'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b chore/dependency-updates
        npm update --no-audit --no-fund || true
        git add package.json package-lock.json || true
        git commit -m "chore(deps): update dependencies" || echo "No changes to commit"
        git push --set-upstream origin chore/dependency-updates || true

    - name: Open Pull Request via GitHub CLI
      if: steps.check.outputs.outdated != '{}'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if gh pr view chore/dependency-updates >/dev/null 2>&1; then
          echo "PR already exists"
        else
          gh pr create \
            --base develop \
            --head chore/dependency-updates \
            --title "🔄 Automated dependency updates" \
            --body $'## Automated Dependency Updates\n\nThis PR updates outdated dependencies to their latest versions.\n\n### Changes\n- Updates npm dependencies to latest compatible versions\n- Includes security patches and bug fixes\n\n### Testing\n- [ ] All tests pass\n- [ ] Build completes successfully\n- [ ] No breaking changes introduced\n\n### Notes\n- This is an automated PR created by GitHub Actions\n- Please review the changes and test thoroughly before merging'

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Create security issue if vulnerabilities found
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['security']
          });
          
          const hasOpenSecurityIssue = issues.some(issue => 
            issue.title.includes('Security vulnerabilities detected')
          );
          
          if (!hasOpenSecurityIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected',
              body: `
                ## Security Alert
                
                Security vulnerabilities have been detected in the project dependencies.
                
                ### Action Required
                1. Run \`npm audit\` locally to see details
                2. Update vulnerable dependencies
                3. Test thoroughly after updates
                4. Close this issue when resolved
                
                ### Next Steps
                - Review the npm audit output
                - Update packages with security patches
                - Run full test suite
                - Deploy updates to production
              `,
              labels: ['security', 'high-priority']
            });
          } 