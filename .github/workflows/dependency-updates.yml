name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-deps:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for outdated dependencies
      id: check
      run: |
        npm outdated --json > outdated.json || echo "{}" > outdated.json
        echo "outdated=$(cat outdated.json)" >> $GITHUB_OUTPUT

    - name: Create Pull Request for updates
      if: steps.check.outputs.outdated != '{}'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore(deps): update dependencies'
        title: '🔄 Automated dependency updates'
        body: |
          ## Automated Dependency Updates
          
          This PR updates outdated dependencies to their latest versions.
          
          ### Changes
          - Updates npm dependencies to latest compatible versions
          - Includes security patches and bug fixes
          
          ### Testing
          - [ ] All tests pass
          - [ ] Build completes successfully
          - [ ] No breaking changes introduced
          
          ### Notes
          - This is an automated PR created by GitHub Actions
          - Please review the changes and test thoroughly before merging
        branch: chore/dependency-updates
        delete-branch: true
        base: develop

  security-audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: npm audit --audit-level=moderate

    - name: Create security issue if vulnerabilities found
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['security']
          });
          
          const hasOpenSecurityIssue = issues.some(issue => 
            issue.title.includes('Security vulnerabilities detected')
          );
          
          if (!hasOpenSecurityIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security vulnerabilities detected',
              body: `
                ## Security Alert
                
                Security vulnerabilities have been detected in the project dependencies.
                
                ### Action Required
                1. Run \`npm audit\` locally to see details
                2. Update vulnerable dependencies
                3. Test thoroughly after updates
                4. Close this issue when resolved
                
                ### Next Steps
                - Review the npm audit output
                - Update packages with security patches
                - Run full test suite
                - Deploy updates to production
              `,
              labels: ['security', 'high-priority']
            });
          } 