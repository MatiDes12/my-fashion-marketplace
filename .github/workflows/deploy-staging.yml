name: Deploy to Staging

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Build application
      run: npm run build

    - name: Deploy to Vercel (Staging)
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
        vercel-args: '--target=preview'

    - name: Run E2E tests against staging
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Run basic smoke tests
        curl -f ${{ steps.deploy.outputs.preview-url }} || exit 1

    - name: Comment PR with staging URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const hasStagingComment = comments.some(comment => 
            comment.body.includes('🚀 Staging deployment')
          );
          
          if (!hasStagingComment) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `
                🚀 **Staging deployment ready!**
                
                **Preview URL:** ${{ steps.deploy.outputs.preview-url }}
                
                Please test the following:
                - [ ] Home page loads correctly
                - [ ] Navigation works
                - [ ] Product browsing
                - [ ] Cart functionality
                - [ ] Authentication flows
                - [ ] Mobile responsiveness
                
                Report any issues in this PR.
              `
            });
          }

  notify-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()
    steps:
    - name: Notify staging deployment
      run: |
        if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
          echo "✅ Staging deployment completed successfully"
          echo "URL: ${{ needs.deploy-staging.outputs.preview-url }}"
        else
          echo "❌ Staging deployment failed"
          exit 1
        fi 