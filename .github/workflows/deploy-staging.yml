name: Deploy to Staging

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      preview-url: ${{ steps.vercel.outputs.preview-url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Type check
      run: npm run type-check

    - name: Build application
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NODE_ENV: production
      run: npm run build

    - name: Deploy to Vercel (Staging)
      id: vercel
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
      run: |
        npm i -g vercel@latest
        # Ensure required env vars are present for preview build
        mkdir -p .vercel
        echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .vercel/.env.preview.local
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .vercel/.env.preview.local
        echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .vercel/.env.preview.local
        echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .vercel/.env.preview.local
        echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .vercel/.env.preview.local
        echo "NEXT_PUBLIC_PUSHER_APP_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}" >> .vercel/.env.preview.local
        echo "NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}" >> .vercel/.env.preview.local
        echo "PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" >> .vercel/.env.preview.local
        echo "PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}" >> .vercel/.env.preview.local
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .vercel/.env.preview.local
        echo "TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}" >> .vercel/.env.preview.local
        echo "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" >> .vercel/.env.preview.local
        echo "TELEGRAM_SUPPORT_CHAT_ID=${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}" >> .vercel/.env.preview.local
        echo "CHAPA_SECRET_KEY=${{ secrets.CHAPA_SECRET_KEY }}" >> .vercel/.env.preview.local
        echo "CHAPA_PUBLIC_KEY=${{ secrets.CHAPA_PUBLIC_KEY }}" >> .vercel/.env.preview.local
        echo "NEXT_PUBLIC_JAWG_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}" >> .vercel/.env.preview.local
        vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
        vercel build --token="$VERCEL_TOKEN"
        output=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
        echo "$output"
        url=$(echo "$output" | grep -Eo 'https?://[^ ]+\.vercel\.app' | head -n1)
        if [ -n "$url" ]; then echo "preview-url=$url" >> "$GITHUB_OUTPUT"; fi

    - name: Run E2E tests against staging
      run: |
        # Wait for deployment to be ready
        sleep 30
        
        # Run basic smoke tests
        curl -f ${{ steps.vercel.outputs.preview-url }} || exit 1

    - name: Comment PR with staging URL
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          const hasStagingComment = comments.some(comment => 
            comment.body.includes('🚀 Staging deployment')
          );
          
          if (!hasStagingComment) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `
                🚀 **Staging deployment ready!**
                
                 **Preview URL:** ${{ steps.vercel.outputs.preview-url }}
                
                Please test the following:
                - [ ] Home page loads correctly
                - [ ] Navigation works
                - [ ] Product browsing
                - [ ] Cart functionality
                - [ ] Authentication flows
                - [ ] Mobile responsiveness
                
                Report any issues in this PR.
              `
            });
          }

  notify-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()
    steps:
    - name: Notify staging deployment
      run: |
        if [ "${{ needs.deploy-staging.result }}" == "success" ]; then
          echo "✅ Staging deployment completed successfully"
          echo "URL: ${{ needs.deploy-staging.outputs.preview-url }}"
        else
          echo "❌ Staging deployment failed"
          exit 1
        fi 