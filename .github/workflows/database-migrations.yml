name: Database Migrations

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - 'supabase/migrations/**'
  pull_request:
    branches: [ "master", "main" ]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Supabase CLI
      run: |
        curl -fsSL https://supabase.com/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Validate migration files
      run: |
        # Check if migration files are properly formatted
        for file in supabase/migrations/*.sql; do
          if [ -f "$file" ]; then
            echo "Validating $file"
            # Basic SQL syntax check (you might want to add more sophisticated validation)
            if ! grep -q "^--.*migration" "$file" && ! grep -q "^--.*Migration" "$file"; then
              echo "Warning: $file might be missing migration comment"
            fi
          fi
        done

  apply-migrations:
    runs-on: ubuntu-latest
    needs: validate-migrations
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Supabase CLI
      run: |
        curl -fsSL https://supabase.com/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Apply migrations to staging
      run: |
        supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        supabase db push --linked
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    - name: Run database tests
      run: |
        # Add your database test commands here
        echo "Running database tests..."
        # Example: npm run test:db

    - name: Apply migrations to production
      if: success()
      run: |
        supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        supabase db push --linked
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    - name: Notify migration completion
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Database migrations applied successfully"
        else
          echo "❌ Database migration failed"
          exit 1
        fi

  backup-database:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Supabase CLI
      run: |
        curl -fsSL https://supabase.com/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Create database backup
      run: |
        supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        supabase db dump --data-only --file backup-$(date +%Y%m%d-%H%M%S).sql
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    - name: Upload backup
      uses: actions/upload-artifact@v4
      with:
        name: database-backup-${{ github.sha }}
        path: backup-*.sql
        retention-days: 30 