name: Deploy to Production

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build application
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NODE_ENV: production
      run: npm run build

    - name: Deploy to Vercel
      run: |
        npm i -g vercel@latest
        mkdir -p .vercel
        # Pull current Vercel env and settings first, then append required vars
        vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        # Ensure required env vars are present in Vercel env for build phase
        echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .vercel/.env.production.local
        echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .vercel/.env.production.local
        echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .vercel/.env.production.local
        echo "NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}" >> .vercel/.env.production.local
        echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .vercel/.env.production.local
        echo "NEXT_PUBLIC_PUSHER_APP_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}" >> .vercel/.env.production.local
        echo "NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}" >> .vercel/.env.production.local
        echo "PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" >> .vercel/.env.production.local
        echo "PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}" >> .vercel/.env.production.local
        echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .vercel/.env.production.local
        echo "TELEGRAM_WEBHOOK_URL=${{ secrets.TELEGRAM_WEBHOOK_URL }}" >> .vercel/.env.production.local
        echo "TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" >> .vercel/.env.production.local
        echo "TELEGRAM_SUPPORT_CHAT_ID=${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}" >> .vercel/.env.production.local
        echo "CHAPA_SECRET_KEY=${{ secrets.CHAPA_SECRET_KEY }}" >> .vercel/.env.production.local
        echo "CHAPA_PUBLIC_KEY=${{ secrets.CHAPA_PUBLIC_KEY }}" >> .vercel/.env.production.local
        echo "NEXT_PUBLIC_JAWG_ACCESS_TOKEN=${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}" >> .vercel/.env.production.local
        vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"

    - name: Notify deployment
      if: success()
      run: |
        echo "🚀 Production deployment completed successfully!"
        echo "Environment: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Author: ${{ github.actor }}"

  notify-slack:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    env:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      SLACK_CHANNEL: C099RQJ725B
    steps:
    - name: Notify Slack
      if: ${{ env.SLACK_WEBHOOK != '' }}
      run: |
        color="good"
        [ "${{ needs.deploy.result }}" = "failure" ] && color="danger" || true
        cat > payload.json << 'JSON'
        {
          "attachments": [
            {
              "color": "__COLOR__",
              "title": "Production deployment __STATUS__",
              "text": "Repository: __REPO__\nBranch: __BRANCH__\nCommit: __SHA__\nAuthor: __AUTHOR__\nRun: https://github.com/__REPO__/actions/runs/__RUN_ID__"
            }
          ]
        }
        JSON
        sed -i "s|__COLOR__|$color|g" payload.json
        sed -i "s|__STATUS__|${{ needs.deploy.result }}|g" payload.json
        sed -i "s|__REPO__|${{ github.repository }}|g" payload.json
        sed -i "s|__BRANCH__|${{ github.ref_name }}|g" payload.json
        sed -i "s|__SHA__|${{ github.sha }}|g" payload.json
        sed -i "s|__AUTHOR__|${{ github.actor }}|g" payload.json
        sed -i "s|__RUN_ID__|${{ github.run_id }}|g" payload.json
        curl -X POST -H 'Content-type: application/json' --data @payload.json "$SLACK_WEBHOOK"
      env:
        SLACK_WEBHOOK: ${{ env.SLACK_WEBHOOK }}
        SLACK_CHANNEL: ${{ env.SLACK_CHANNEL }}
