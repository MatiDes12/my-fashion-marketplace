name: Workflow Status Monitor

on:
  workflow_run:
    workflows: 
      - "Next.js CI/CD"
      - "CodeQL Security Analysis"
      - "E2E Tests"
      - "Code Quality"
      - "Optimization & Performance Checks"
      - "Deploy to Production"
      - "Deploy to Staging"
      - "Database Migrations"
      - "Dependency Updates"
      - "Datadog Synthetic Tests"
    branches:
      - master
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-status:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'skipped'
    steps:
    - name: Check workflow status
      uses: actions/github-script@v7
      with:
        script: |
          const { data: workflows } = await github.rest.actions.listWorkflowRunsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 10
          });
          
          console.log('Recent workflow runs:');
          workflows.workflow_runs.forEach(run => {
            const status = run.conclusion === 'success' ? '✅' : run.conclusion === 'failure' ? '❌' : '⚠️';
            console.log(`${status} ${run.name}: ${run.conclusion || run.status}`);
          });
          
          // Check for failed workflows
          const failedWorkflows = workflows.workflow_runs.filter(run => 
            run.conclusion === 'failure' && run.created_at > new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString()
          );
          
          if (failedWorkflows.length > 0) {
            console.log(`\n⚠️  ${failedWorkflows.length} workflows failed in the last 24 hours:`);
            failedWorkflows.forEach(run => {
              console.log(`- ${run.name}: ${run.html_url}`);
            });
          } else {
            console.log('\n✅ All workflows are passing!');
          }

  performance-metrics:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NODE_ENV: production
      run: npm run build

    - name: Generate performance report
      run: |
        echo "## 📊 Performance Metrics" >> performance-report.md
        echo "" >> performance-report.md
        
        # Build time
        echo "### Build Performance" >> performance-report.md
        echo "- Build completed successfully" >> performance-report.md
        
        # Bundle size
        echo "" >> performance-report.md
        echo "### Bundle Size" >> performance-report.md
        echo "- Total .next size: $(du -sh .next/ | cut -f1)" >> performance-report.md
        echo "- JavaScript chunks: $(du -sh .next/static/chunks/ | cut -f1)" >> performance-report.md
        echo "- CSS size: $(du -sh .next/static/css/ | cut -f1)" >> performance-report.md
        
        # Large files
        echo "" >> performance-report.md
        echo "### Large Files (>500KB)" >> performance-report.md
        find .next/static/chunks/ -name "*.js" -size +500k -exec ls -lh {} \; >> performance-report.md || echo "No large files found" >> performance-report.md

    - name: Upload performance report
      uses: actions/upload-artifact@v4
      with:
        name: performance-report
        path: performance-report.md
        retention-days: 7

  security-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Security audit
      run: |
        echo "## 🔒 Security Status" >> security-report.md
        echo "" >> security-report.md
        
        # npm audit
        echo "### npm audit" >> security-report.md
        npm audit --audit-level=moderate >> security-report.md || echo "No vulnerabilities found" >> security-report.md
        
        # Check for secrets in code
        echo "" >> security-report.md
        echo "### Secret Detection" >> security-report.md
        if grep -r "password\|secret\|key\|token" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "NEXT_PUBLIC_" | grep -v "process.env"; then
          echo "⚠️  Potential secrets found in code" >> security-report.md
        else
          echo "✅ No obvious secrets found in code" >> security-report.md
        fi

    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.md
        retention-days: 7

  comprehensive-report:
    runs-on: ubuntu-latest
    needs: [workflow-status, performance-metrics, security-check]
    if: always()
    steps:
    - name: Generate comprehensive report
      run: |
        echo "## 🚀 CI/CD Comprehensive Status Report" >> comprehensive-report.md
        echo "" >> comprehensive-report.md
        echo "### Workflow Status" >> comprehensive-report.md
        echo "- Status: ${{ needs.workflow-status.result }}" >> comprehensive-report.md
        echo "" >> comprehensive-report.md
        echo "### Performance Metrics" >> comprehensive-report.md
        echo "- Status: ${{ needs.performance-metrics.result }}" >> comprehensive-report.md
        echo "" >> comprehensive-report.md
        echo "### Security Status" >> comprehensive-report.md
        echo "- Status: ${{ needs.security-check.result }}" >> comprehensive-report.md
        echo "" >> comprehensive-report.md
        echo "---" >> comprehensive-report.md
        echo "*Report generated at $(date)*" >> comprehensive-report.md

    - name: Upload comprehensive report
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-report
        path: comprehensive-report.md
        retention-days: 30

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const jobs = ['workflow-status', 'performance-metrics', 'security-check'];
          
          let report = '## 🚀 CI/CD Status Report\n\n';
          
          const jobResults = {
            'workflow-status': '${{ needs.workflow-status.result }}',
            'performance-metrics': '${{ needs.performance-metrics.result }}',
            'security-check': '${{ needs.security-check.result }}'
          };
          
          jobs.forEach(job => {
            const status = jobResults[job];
            const emoji = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            const name = job.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
            report += `${emoji} **${name}**: ${status}\n`;
          });
          
          report += '\n---\n*This report was generated automatically by GitHub Actions.*';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: report
          }); 