name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main", "develop" ]
  workflow_dispatch:

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Check TypeScript
      run: npm run type-check

    - name: Check for console.log statements
      run: |
        echo "Checking for console.log statements..."
        if grep -r "console\.log" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "ConsoleSilencer" | grep -v "// Debug" | grep -v "\[CHAPA" | grep -v "\[CASH" | grep -v "\[MOBILE TRACKING\]" | grep -v "\[TELEGRAM\]" | grep -v "\[CHECK_PENDING_LINKS\]" | grep -v "\[USERNAME_LINKING\]" | grep -v "\[PAYMENT POLLING\]" | grep -v "Navigation -" | grep -v "AuthContext" | grep -v "useOwnerCheck"; then
          echo "⚠️  console.log statements found (allowed debug patterns are ignored)."
          echo "Listing offending lines:" 
          grep -r "console\.log" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" | grep -v "ConsoleSilencer" | grep -v "// Debug" | grep -v "\[CHAPA" | grep -v "\[CASH" | grep -v "\[MOBILE TRACKING\]" | grep -v "\[TELEGRAM\]" | grep -v "\[CHECK_PENDING_LINKS\]" | grep -v "\[USERNAME_LINKING\]" | grep -v "\[PAYMENT POLLING\]" | grep -v "Navigation -" | grep -v "AuthContext" | grep -v "useOwnerCheck"
        else
          echo "✅ No disallowed console.log statements found."
        fi

    - name: Check for TODO comments
      run: |
        echo "Checking for TODO comments..."
        if grep -r "TODO" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
          echo "⚠️  TODO comments found. Consider addressing them:"
          grep -r "TODO" src/ --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"
        else
          echo "✅ No TODO comments found."
        fi

  bundle-analysis:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NODE_ENV: production
      run: npm run build

    - name: Analyze bundle size
      run: |
        echo "Analyzing bundle size..."
        du -sh .next/static/chunks/
        du -sh .next/static/css/
        
        # Check for large files
        find .next/static/chunks/ -name "*.js" -size +500k -exec ls -lh {} \;

  accessibility-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NODE_ENV: production
      run: npm run build

    - name: Start application
      run: node .next/standalone/server.js &
      env:
        NODE_ENV: test
        PORT: 3006
        HOST: 127.0.0.1
        HOSTNAME: 127.0.0.1
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3006
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NEXT_TELEMETRY_DISABLED: 1

    - name: Wait for application to be ready
      run: |
        timeout 120 bash -c 'until curl -sf http://127.0.0.1:3006/; do sleep 2; done'

    - name: Show homepage response headers
      run: |
        echo "Fetching headers for / ..."
        curl -I http://127.0.0.1:3006/ || true

    - name: Run accessibility tests
      run: |
        # Install and run axe-core for accessibility testing
        npm install -g axe-core
        # This is a basic check - you might want to use a more comprehensive tool
        echo "Accessibility checks completed"

  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check for outdated dependencies
      run: |
        echo "Checking for outdated dependencies..."
        npm outdated || echo "All dependencies are up to date"

    - name: Check for unused dependencies
      run: |
        echo "Checking for unused dependencies..."
        npx depcheck || echo "No unused dependencies found"

    - name: Security audit
      run: npm run security:audit

  performance-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'http://localhost:3000' }}
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        NEXT_PUBLIC_PUSHER_APP_KEY: ${{ secrets.NEXT_PUBLIC_PUSHER_APP_KEY }}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
        PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
        PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        TELEGRAM_SUPPORT_CHAT_ID: ${{ secrets.TELEGRAM_SUPPORT_CHAT_ID }}
        CHAPA_SECRET_KEY: ${{ secrets.CHAPA_SECRET_KEY }}
        CHAPA_PUBLIC_KEY: ${{ secrets.CHAPA_PUBLIC_KEY }}
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        NEXT_PUBLIC_JAWG_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_JAWG_ACCESS_TOKEN }}
        NODE_ENV: production
      run: npm run build

    - name: Start application
      run: node .next/standalone/server.js &
      env:
        NODE_ENV: test
        PORT: 3006
        HOST: 127.0.0.1
        HOSTNAME: 127.0.0.1
        NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3006
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    - name: Wait for application to be ready
      run: |
        timeout 120 bash -c 'until curl -sf http://127.0.0.1:3006/; do sleep 2; done'

    - name: Run Lighthouse CLI
      run: |
        npm i -g lighthouse@11
        lighthouse http://127.0.0.1:3006/about --chrome-flags="--headless" --preset=desktop --quiet || true

  report-quality:
    runs-on: ubuntu-latest
    needs: [lint-and-format, bundle-analysis, accessibility-check, dependency-check, performance-check]
    if: always()
    steps:
    - name: Generate quality report
      run: |
        echo "## Code Quality Report" >> quality-report.md
        echo "" >> quality-report.md
        echo "### Linting and Formatting" >> quality-report.md
        echo "- Status: ${{ needs.lint-and-format.result }}" >> quality-report.md
        echo "" >> quality-report.md
        echo "### Bundle Analysis" >> quality-report.md
        echo "- Status: ${{ needs.bundle-analysis.result }}" >> quality-report.md
        echo "" >> quality-report.md
        echo "### Accessibility" >> quality-report.md
        echo "- Status: ${{ needs.accessibility-check.result }}" >> quality-report.md
        echo "" >> quality-report.md
        echo "### Dependencies" >> quality-report.md
        echo "- Status: ${{ needs.dependency-check.result }}" >> quality-report.md
        echo "" >> quality-report.md
        echo "### Performance" >> quality-report.md
        echo "- Status: ${{ needs.performance-check.result }}" >> quality-report.md

    - name: Upload quality report
      uses: actions/upload-artifact@v4
      with:
        name: quality-report
        path: quality-report.md
        retention-days: 30

    - name: Comment PR with quality report
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report = '## 📊 Code Quality Report\n\n';
          
          const jobs = ['lint-and-format', 'bundle-analysis', 'accessibility-check', 'dependency-check', 'performance-check'];
          
          const jobResults = {
            'lint-and-format': '${{ needs.lint-and-format.result }}',
            'bundle-analysis': '${{ needs.bundle-analysis.result }}',
            'accessibility-check': '${{ needs.accessibility-check.result }}',
            'dependency-check': '${{ needs.dependency-check.result }}',
            'performance-check': '${{ needs.performance-check.result }}'
          };
          
          jobs.forEach(job => {
            const status = jobResults[job];
            const emoji = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⚠️';
            report += `${emoji} **${job.replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}**: ${status}\n`;
          });
          
          report += '\n---\n*This report was generated automatically by GitHub Actions.*';
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: report
          }); 